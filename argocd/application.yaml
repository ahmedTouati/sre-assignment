apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: token-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ahmedTouati/sre-assignment.git
    targetRevision: main
    path: charts/token-stack
    helm:
      releaseName: token-stack
      parameters:
        - name: credentials.existingSecret
          value: token-stack-credentials
        - name: networkPolicy.enabled
          value: "true"
        - name: python.autoscaling.enabled
          value: "true"
        - name: go.autoscaling.enabled
          value: "true"
        - name: otel.endpoint
          value: otel-collector.observability.svc.cluster.local:4317
  destination:
    server: https://kubernetes.default.svc
    namespace: token-stack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
