    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "token-stack.selectorLabels" (dict "root" . "component" "python") | nindent 14 }}
      ports:
        - port: 50051
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 9090
          protocol: TCP
    - ports:
        - port: 15020
          protocol: TCP
        - port: 15021
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "token-stack.selectorLabels" (dict "root" . "component" "redis") | nindent 14 }}
      ports:
        - port: 6379
          protocol: TCP
    {{- include "token-stack.commonEgress" . | nindent 4 }}
