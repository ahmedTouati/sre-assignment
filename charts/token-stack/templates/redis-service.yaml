apiVersion: v1
kind: Service
metadata:
  name: {{ include "token-stack.redisName" . }}
  labels:
    {{- include "token-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "token-stack.selectorLabels" (dict "root" . "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
