{{- if .Values.credentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "token-stack.credentialsSecretName" . }}
  labels:
    {{- include "token-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-admin-password: {{ .Values.credentials.postgresAdminPassword | quote }}
  postgres-app-password: {{ .Values.credentials.postgresAppPassword | quote }}
  redis-password: {{ .Values.credentials.redisPassword | quote }}
{{- end }}
