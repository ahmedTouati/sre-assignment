fullnameOverride: tempo

tempo:
  reportingEnabled: false
  memBallastSizeMbs: 64
  retention: 24h
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

persistence:
  enabled: true
  size: 2Gi

serviceAccount:
  create: false
  automountServiceAccountToken: false

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 5s
