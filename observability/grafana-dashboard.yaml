apiVersion: v1
kind: ConfigMap
metadata:
  name: token-services-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  token-services.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "targets": [
            {"expr": "sum(rate(http_requests_total{handler=\"/token\"}[$__rate_interval]))", "legendFormat": "Python HTTP", "refId": "A"},
            {"expr": "sum(rate(grpc_server_requests_total{method=~\".*/MintToken\"}[$__rate_interval]))", "legendFormat": "Go gRPC", "refId": "B"}
          ],
          "title": "Request rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"max": 100, "min": 0, "unit": "percent"}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "targets": [
            {"expr": "100 * (1 - token:python_availability:ratio_rate5m)", "legendFormat": "Python HTTP", "refId": "A"},
            {"expr": "100 * (1 - token:go_availability:ratio_rate5m)", "legendFormat": "Go gRPC", "refId": "B"}
          ],
          "title": "Error rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 3,
          "targets": [
            {"expr": "token:python_latency:p95_rate5m", "legendFormat": "Python HTTP", "refId": "A"},
            {"expr": "token:go_latency:p95_rate5m", "legendFormat": "Go gRPC", "refId": "B"}
          ],
          "title": "Request duration p95",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"max": 100, "min": 0, "unit": "percent"}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 4,
          "targets": [
            {"expr": "100 * postgres_pool_connections_in_use / clamp_min(postgres_pool_connections_limit, 1)", "legendFormat": "Pool utilization", "refId": "A"}
          ],
          "title": "PostgreSQL connection pool",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"min": 0, "unit": "short"}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "id": 5,
          "targets": [
            {"expr": "redis_queue_depth", "legendFormat": "Outstanding operations", "refId": "A"}
          ],
          "title": "Redis queue depth",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "id": 6,
          "targets": [
            {"expr": "histogram_quantile(0.95, sum by (le) (rate(postgres_pool_acquire_duration_seconds_bucket[$__rate_interval])))", "legendFormat": "PostgreSQL acquire", "refId": "A"},
            {"expr": "histogram_quantile(0.95, sum by (le) (rate(redis_operation_duration_seconds_bucket[$__rate_interval])))", "legendFormat": "Redis operation", "refId": "B"}
          ],
          "title": "Dependency duration p95",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 42,
      "tags": ["token-service"],
      "templating": {"list": []},
      "time": {"from": "now-30m", "to": "now"},
      "timezone": "browser",
      "title": "Token Services",
      "uid": "token-services"
    }
