services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tokendb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
      POSTGRES_APP_USER: tokenapp
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      # The API gets a separate read-only role.
      - ./database/002-app-role.sql:/docker-entrypoint-initdb.d/002-app-role.sql:ro
    # Wait for the schema and application role, not just the server process.
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD=$$POSTGRES_APP_PASSWORD psql -h 127.0.0.1 -U tokenapp -d $$POSTGRES_DB -c 'SELECT 1 FROM users LIMIT 1' >/dev/null
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  go-service:
    build:
      context: ./golang-service
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      # gRPC stays inside the Compose network; only metrics reaches the host.
      - "127.0.0.1:${GO_METRICS_PORT:-9090}:9090"
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  python-service:
    build:
      context: ./python-service
    environment:
      DATABASE_URL: postgresql://tokenapp@postgres:5432/tokendb
      PGPASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
      TOKEN_SERVICE_HOST: go-service:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:${PYTHON_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      go-service:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  redis-data:
